<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIUL - Crear Nuevo Proyecto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="dashboard-body">
    <!-- Barra de Navegación Superior -->
    <header class="navbar">
        <div class="nav-brand">
            <span class="logo-box">R</span>
            <span class="brand-title"><strong>RIUL</strong> / Dashboard Docente</span>
        </div>
        <div class="nav-actions">
            <a href="#" class="btn-secondary">Mi Perfil</a>
            <a href="#" class="btn-secondary">Publicar en feed</a>
            <a href="#" class="btn-secondary">Mis Semilleros</a>
            <a href="#" class="btn-secondary" style="color: #b71c1c; border-color: #b71c1c;">Salir</a>
        </div>
    </header>

    <main class="auth-container centered" style="padding: 30px 20px;">
        <!-- Modal / Contenedor Crear Nuevo Proyecto -->
        <section class="login-card-box modal-evidence-box" style="max-width: 750px; width: 100%;">
            <div class="form-header-title">
                <h2 style="font-size: 22px; font-weight: bold; margin-bottom: 20px;">Crear Nuevo Proyecto</h2>
            </div>

            <form action="#" method="POST">
                <!-- Título del Proyecto -->
                <div class="form-group" style="margin-bottom: 18px;">
                    <label for="titulo_proyecto"><strong>Título del Proyecto *</strong></label>
                    <input type="text" id="titulo_proyecto" name="titulo_proyecto" placeholder="[ campo de entrada ]" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-top: 6px;">
                </div>

                <!-- Línea de Investigación -->
                <div class="form-group" style="margin-bottom: 18px;">
                    <label for="linea_investigacion"><strong>Línea de Investigación *</strong></label>
                    <select id="linea_investigacion" name="linea_investigacion" class="form-select" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-top: 6px; background-color: #fff;">
                        <option value="" disabled selected>Seleccionar línea ▾</option>
                        <option value="1">Biotecnología Aplicada</option>
                        <option value="2">Desarrollo de Software y Computación</option>
                        <option value="3">Derecho Penal y Criminología</option>
                    </select>
                </div>

                <!-- Fecha de Inicio + Fecha de Cierre -->
                <div class="form-group" style="margin-bottom: 18px;">
                    <label><strong>Fecha de Inicio + Fecha de Cierre</strong></label>
                    <div style="display: flex; gap: 15px; margin-top: 6px;">
                        <input type="date" id="fecha_inicio" name="fecha_inicio" placeholder="[ fecha ]" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                        <input type="date" id="fecha_cierre" name="fecha_cierre" placeholder="[ fecha ]" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                    </div>
                </div>

                <!-- Resumen del Proyecto -->
                <div class="form-group" style="margin-bottom: 22px;">
                    <label for="resumen"><strong>Resumen del Proyecto</strong></label>
                    <textarea id="resumen" name="resumen" rows="4" placeholder="[ campo de entrada ]" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-top: 6px; resize: vertical;"></textarea>
                </div>

                <!-- Vincular Estudiantes al Proyecto -->
                <div class="form-group" style="margin-bottom: 25px;">
                    <label style="font-size: 15px; margin-bottom: 8px; display: block;"><strong>Vincular Estudiantes al Proyecto</strong></label>
                    <input type="text" placeholder="Buscar por nombre o programa..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">

                    <!-- Listado de Estudiantes Seleccionables -->
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <div style="border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 14px; background: #fafafa; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #444;">
                            <input type="checkbox" id="est_1" name="estudiantes" value="1">
                            <div style="width: 24px; height: 24px; border-radius: 50%; background: #ccc; display: inline-block;"></div>
                            <label for="est_1" style="margin: 0; cursor: pointer;">Avatar Nombre • Rol • Programa • Semestre</label>
                        </div>
                        <div style="border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 14px; background: #fafafa; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #444;">
                            <input type="checkbox" id="est_2" name="estudiantes" value="2">
                            <div style="width: 24px; height: 24px; border-radius: 50%; background: #ccc; display: inline-block;"></div>
                            <label for="est_2" style="margin: 0; cursor: pointer;">Avatar Nombre • Rol • Programa • Semestre</label>
                        </div>
                        <div style="border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 14px; background: #fafafa; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #444;">
                            <input type="checkbox" id="est_3" name="estudiantes" value="3">
                            <div style="width: 24px; height: 24px; border-radius: 50%; background: #ccc; display: inline-block;"></div>
                            <label for="est_3" style="margin: 0; cursor: pointer;">Avatar Nombre • Rol • Programa • Semestre</label>
                        </div>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div style="display: flex; justify-content: center; gap: 20px; margin-top: 25px;">
                    <a href="#" class="btn-secondary" style="padding: 8px 30px; font-size: 13px; text-decoration: none;">Cancelar</a>
                    <button type="submit" class="btn-secondary" style="padding: 8px 30px; font-size: 13px; font-weight: bold; background-color: #fff; cursor: pointer;">Crear proyecto</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
