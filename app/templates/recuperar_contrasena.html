<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIUL - Recuperar Contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="dashboard-body">
    <!-- Barra de Navegación Superior -->
    <header class="navbar">
        <div class="nav-brand">
            <span class="logo-box">R</span>
            <span class="brand-title"><strong>RIUL / Autenticación</strong></span>
        </div>
    </header>

    <main class="auth-container centered" style="padding: 40px 20px; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <!-- Modal / Contenedor Recuperar Contraseña -->
        <section class="login-card-box modal-evidence-box" style="max-width: 550px; width: 100%; text-align: left; padding: 30px;">
            <div class="form-header-title" style="margin-bottom: 20px;">
                <h2 style="font-size: 22px; font-weight: bold; margin: 0;">Recuperar Contraseña</h2>
            </div>

            <form action="#" method="POST">
                <!-- Correo Institucional -->
                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="correo" style="font-size: 13px; font-weight: bold; margin-bottom: 6px; display: block;">Correo Institucional</label>
                    <input type="email" id="correo" name="correo" placeholder="nombre@unilibre.edu.co" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;">
                </div>

                <!-- Botones de Acción -->
                <div style="display: flex; gap: 15px;">
                    <a href="{{ url_for('auth.login') }}" class="btn-secondary" style="flex: 1; padding: 10px; font-size: 13px; text-decoration: none; text-align: center;">Cancelar</a>
                    <button type="submit" class="btn-primary-block" style="flex: 1; margin-top: 0; padding: 10px; font-size: 13px; text-align: center; background-color: #fff; border: 1px solid #ccc; color: #333; font-weight: bold; cursor: pointer;">Enviar Enlace</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
