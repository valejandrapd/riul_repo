<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIUL - Admin / Crear Convocatoria Institucional</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="dashboard-body">
    <!-- Barra de Navegación Superior -->
    <header class="navbar">
        <div class="nav-brand">
            <span class="logo-box">R</span>
            <span class="brand-title"><strong>RIUL - Administrador</strong></span>
        </div>
        <div class="nav-actions">
            <a href="#" class="btn-secondary" style="color: #b71c1c; border-color: #b71c1c;">Salir</a>
        </div>
    </header>

    <main class="auth-container centered" style="padding: 30px 20px;">
        <!-- Contenedor Principal / Formulario de Convocatoria -->
        <section class="login-card-box modal-evidence-box" style="max-width: 750px; width: 100%; text-align: left;">
            <div class="form-header-title" style="margin-bottom: 20px;">
                <h2 style="font-size: 22px; font-weight: bold; margin: 0;">Crear Convocatoria Institucional</h2>
            </div>

            <form action="#" method="POST" enctype="multipart/form-data">
                <!-- Título de la Convocatoria -->
                <div class="form-group" style="margin-bottom: 18px;">
                    <label for="titulo_convocatoria" style="font-size: 13px; font-weight: bold; margin-bottom: 6px; display: block;">Título de la Convocatoria</label>
                    <input type="text" id="titulo_convocatoria" name="titulo_convocatoria" placeholder="[ campo ]" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;">
                </div>

                <!-- Fecha de Apertura + Fecha de Cierre -->
                <div class="form-group" style="margin-bottom: 18px;">
                    <label for="fechas" style="font-size: 13px; font-weight: bold; margin-bottom: 6px; display: block;">Fecha de Apertura + Fecha de Cierre</label>
                    <input type="text" id="fechas" name="fechas" placeholder="[ campo ]" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;">
                </div>

                <!-- Presupuesto / Monto Disponible -->
                <div class="form-group" style="margin-bottom: 18px;">
                    <label for="presupuesto" style="font-size: 13px; font-weight: bold; margin-bottom: 6px; display: block;">Presupuesto / Monto Disponible</label>
                    <input type="text" id="presupuesto" name="presupuesto" placeholder="[ campo ]" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;">
                </div>

                <!-- Líneas de Investigación Elegibles -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="font-size: 13px; font-weight: bold; margin-bottom: 8px; display: block;">Líneas de Investigación Elegibles</label>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; font-size: 13px; color: #444;">
                        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0;">
                            <input type="checkbox" name="lineas" value="1"> Línea elegible
                        </label>
                        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0;">
                            <input type="checkbox" name="lineas" value="2"> Línea elegible
                        </label>
                        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0;">
                            <input type="checkbox" name="lineas" value="3"> Línea elegible
                        </label>
                        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0;">
                            <input type="checkbox" name="lineas" value="4"> Línea elegible
                        </label>
                    </div>
                </div>

                <!-- Bases de la Convocatoria (PDF) -->
                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="bases_pdf" style="font-size: 13px; font-weight: bold; margin-bottom: 6px; display: block;">Bases de la Convocatoria (PDF)</label>
                    <div style="border: 1px solid #ccc; border-radius: 6px; padding: 14px; text-align: center; background: #fafafa;">
                        <input type="file" id="bases_pdf" name="bases_pdf" style="display: none;" onchange="updateFileName(this)">
                        <label for="bases_pdf" style="cursor: pointer; font-weight: normal; margin: 0; color: #555; font-size: 13px;">
                            📎 <span id="file-label">[ Arrastra PDF o selecciona ]</span>
                        </label>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-top: 25px;">
                    <button type="button" class="btn-secondary" style="flex: 1; padding: 10px; font-size: 13px; text-align: center;">Guardar Borrador</button>
                    <button type="submit" class="btn-primary-block" style="flex: 1; margin-top: 0; padding: 10px; font-size: 13px; text-align: center; background-color: #fff; border: 1px solid #ccc; color: #333; font-weight: bold; cursor: pointer;">Publicar Convocatoria</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        // Mostrar nombre del archivo PDF seleccionado
        function updateFileName(input) {
            const label = document.getElementById('file-label');
            if (input.files && input.files[0]) {
                label.textContent = input.files[0].name;
            } else {
                label.textContent = '[ Arrastra PDF o selecciona ]';
            }
        }
    </script>
</body>
</html>
