version: '3.8'

services:
  # 🌐 Servicio Backend / Web App (Flask)
  app:
    build: .
    container_name: riul_web_app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://riul_user:riul_password@db:3306/riul_db
      - JWT_SECRET_KEY=super-secret-key
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 🗄️ Servicio de Base de Datos MySQL 8.0
  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: riul_container   # Nombre del contenedor actualizado
    environment:
      MYSQL_DATABASE: riul_db        # Base de datos oficial de RIUL
      MYSQL_USER: riul_user          # Usuario configurado
      MYSQL_PASSWORD: riul_password  # Contraseña del usuario
      MYSQL_ROOT_PASSWORD: root_password 
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Automatización clave para cargar los scripts automáticamente al iniciar
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    restart: unless-stopped 
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_password || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:                        # Volumen persistente de MySQL